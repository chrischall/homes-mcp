version: 1
name: homes.com
slug: homes
summary: >-
  homes.com real-estate access for Claude — search listings, fetch property
  details, photos, compare, and run mortgage/affordability math
examples:
  - prompt: >-
      Show me the newest single-family homes for sale in Asheville, NC
      between $400,000 and $600,000.
    note: Uses homes_search_properties with a price band and sort.
  - prompt: >-
      What are the median sold price and price per square foot in Boone, NC?
    note: Uses homes_get_market_report (derived from recent sold listings).
  - prompt: >-
      What would the monthly payment be on a $450,000 home with 20% down at
      6.5% for 30 years, including taxes and insurance?
    note: Local mortgage math (homes_calculate_mortgage), no browser needed.
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: HOMES_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: HOMES_COMMUNITIES_FILE
    required: false
    help: >-
      Absolute path to a JSON array of community names, replacing the built-in
      vocabulary (which is specific to the Lake Lure / mountain-NC market).
      Set this to use this server in any other market.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. Hosts that appear
  # solely in a URL this server BUILDS and returns are excluded.
  #
  # This server has ONE mode, the browser bridge: every request goes
  # through FetchproxyTransport (src/transport-fetchproxy.ts) to the
  # user's signed-in tab, which is what dials www.homes.com. The process
  # itself opens only the loopback concentrator port the runner's agent
  # connects to — there is no direct/bootstrap/anonymous path, no env
  # flag that bypasses the bridge, and no `fetch(` outside the transport.
  # So `homes.com` / `www.homes.com` are hosts the BROWSER fetches, not
  # this process, and listing them would admit dials this server never
  # makes. No runtime-discovered hosts.
  allow: []
